  <p class="foot"><button class="link" id="reset" type="button">Clear saved progress</button></p>
  </div></div>`;
  drawHero();
  bindSound();
  $('#another').onclick=()=>drawHero();
  app.querySelectorAll('.stage[data-s]').forEach(b=>b.onclick=()=>launchStage(b.dataset.s));
  $('#go').onclick=()=>launchStage(STAGES[P.best[STAGES[0].id]==null?0:nextIdx].id);
  $('#mix').onclick=()=>start('Smart review',smartMix(20),null);
  $('#mis').onclick=()=>start('Retry mistakes',shuffle(BANK.filter(q=>P.wrong[q.id])),null);
  $('#reset').onclick=()=>{if(confirm('Clear all saved progress and mistakes?')){P.wrong={};P.best={};P.stats={};persist();home();}};
  window.scrollTo(0,0);
}
function launchStage(id){
  const st=STAGES.find(s=>s.id===id);
  let qs=BANK.filter(q=>q.stage===id);
  if(id!=='exam')qs=shuffle(qs);
  start(st.title,qs,id);
}

/* ---------- SESSION ---------- */
function start(name,qs,stageId){
  if(!qs.length){home();return;}
  S={name,stageId,queue:qs.map(q=>({q,retry:0})),i:0,results:[],retries:[],answered:false};
  render();
}
function ctlRow(o){
  return `<div class="row ctl"><button class="btn ghost" id="hb" type="button"></button><button class="btn ghost" id="sa" type="button">${ICON.eye}<span>Show answer</span></button>${o.extra||''}<span class="grow"></span>${o.check?'<button class="btn primary" id="chk" type="button">Check</button>':''}</div>`;
}
function render(){
  if(!S){home();return;}
  if(S.i>=S.queue.length){summary();return;}
  const it=S.queue[S.i],q=it.q;
  {const si=STAGES.findIndex(s=>s.id===q.stage);app.style.setProperty('--sc',si>=0?`var(--s${si})`:'var(--pri)');}
  const pct=Math.round(S.i/S.queue.length*100);
  app.innerHTML=`
  <div class="qtop"><button class="icon-btn" id="back" type="button" aria-label="Back to menu">${ICON.back}</button><div class="qt"><div class="stg">${esc(S.name)}</div><div class="cnt">Question ${S.i+1} of ${S.queue.length}</div></div>${soundBtn()}</div>
  <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div>
  <div class="qgrid">
  <main class="sheet"><div class="meta"><span class="tag">${esc(q.tag)}</span>${it.retry?'<span class="tag retry">Second look</span>':''}<span class="instr">${esc(q.instr||INSTR[q.type])}</span></div><div id="body"></div></main>
  <aside class="side"><div class="tip" id="tip"><ul class="tl">
   <li><span class="ti">${ICON.say}</span><span>Listen anytime</span></li>
   <li><span class="ti">${ICON.bulb}</span><span>Hint <kbd>H</kbd></span></li>
   <li><span class="ti">${ICON.eye}</span><span>Show answer <kbd>S</kbd></span></li>
   <li><span class="ti">${ICON.key}</span><span>Choose <kbd>1</kbd>–<kbd>4</kbd> <kbd>Enter</kbd></span></li>
  </ul></div><div id="fb" aria-live="polite" hidden></div></aside>
  </div>`;
  bindSound();
  $('#back').onclick=()=>{if(!S.results.length||confirm('Leave this session? It will not be scored.'))home();};
  S.answered=false;
  R[q.type](q,$('#body'),it);
  window.scrollTo(0,0);
}
function setHint(left,title){
  const hb=$('#hb');if(!hb)return;
  hb.title=title||'';
  hb.innerHTML=ICON.bulb+`<span>${left>0?`Hint (${left} left)`:'No more hints'}</span>`;
  hb.disabled=left<=0||S.answered;
}
function done(res,extra,spoken){
  const it=S.queue[S.i],q=it.q;
  S.answered=true;
  ['#hb','#sa'].forEach(id=>{const b=$(id);if(b)b.disabled=true;});
  const first=!!res.ok&&!res.hint&&!res.revealed&&!(res.mistakes>0);
  if(it.retry===0){
    S.results.push({q,ok:first,tag:q.tag,hint:!!res.hint,revealed:!!res.revealed});
    if(first)delete P.wrong[q.id];else P.wrong[q.id]=1;
    const st=P.stats[q.id]=P.stats[q.id]||{a:0,c:0};st.a++;if(first)st.c++;
    persist();
  }else S.retries.push({id:q.id,ok:first});
  let again=false;
  if(!first&&it.retry<2){
    S.queue.splice(Math.min(S.i+4,S.queue.length),0,{q:res.retryQ||q,retry:it.retry+1});
    again=true;
  }
  const cls=first?'ok':((res.revealed||res.ok)?'warn':'bad');
  const icon=first?ICON.check:((res.revealed||res.ok)?ICON.half:ICON.cross);
  const title=first?'Correct':(res.revealed?'Here is the answer':(res.msg||(res.ok?(res.hint?'Correct, with some help':'Correct, but review this one'):'Not quite')));
  let h=`<div class="fb-h">${icon}<span>${esc(title)}</span></div>`;
  if(extra)h+=extra;
  if(q.explain)h+=`<p class="exp">${fmt(q.explain)}</p>`;
  if(q.vocab&&q.vocab.length)h+=`<div class="vocab"><b>Remember</b><ul>${q.vocab.map(v=>{
    const parts=v.split(' — ');const hasSay=parts.length>1&&!/V3|[+=]/.test(parts[0]);
    const vi=SET.vi?viLine(viOf(parts[0])):'';
    return `<li>${hasSay?sayBtn(parts[0],'mini'):''}<span>${hasSay?`<b>${esc(parts[0])}</b> — ${esc(parts.slice(1).join(' — '))}`:fmt(v)}${vi}</span></li>`;}).join('')}</ul></div>`;
  if(again)h+=`<p class="again">This one will come back in a few questions.</p>`;
  const last=S.i+1>=S.queue.length;
  const nxHTML=`<button class="btn primary ${'NXCLS'}" id="nx" type="button">${last?'See results':'Next question'}</button>`;
  const ctl=document.querySelector('.sheet .ctl');
  const wide=!(window.matchMedia&&window.matchMedia('(max-width:1000px)').matches);
  const inCard=wide&&!!ctl;
  if(!inCard)h+=nxHTML.replace('NXCLS','wide');
  const fb=$('#fb');fb.className=cls;fb.hidden=false;fb.innerHTML=h;
  const tip=$('#tip');if(tip)tip.hidden=true;
  if(inCard){
    const c=$('#chk');if(c)c.style.display='none';
    ctl.insertAdjacentHTML('beforeend',nxHTML.replace('NXCLS','nxc'));
  }
  $('#nx').onclick=next;
  try{$('#nx').focus({preventScroll:true});}catch(e){}
  if(SET.auto&&spoken){const sb=$('#fb .full .say');say(spoken,sb||null);}
  // narrow layout: bring the feedback into view only if it starts low on screen
  if(!inCard&&window.scrollBy){const top=fb.getBoundingClientRect().top;if(top>window.innerHeight*0.6)window.scrollBy({top:top-72,behavior:'smooth'});}
}
function next(){S.i++;S.answered=false;render();}
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(closeSound()){const sb=$('#sndbtn');if(sb)sb.focus();}return;}
  if(!S||S.i>=S.queue.length||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=(e.target.tagName||'').toLowerCase();
  if(e.key==='Enter'){
    if(tg==='button')return;
    if(S.answered){e.preventDefault();next();}
    else if(tg==='input'){e.preventDefault();const c=$('#chk');if(c)c.click();}
  }else if(!S.answered&&tg!=='input'){
    const ch=e.key.toLowerCase();
    if(ch==='h'){const b=$('#hb');if(b&&!b.disabled)b.click();return;}
    if(ch==='s'){const b=$('#sa');if(b&&!b.disabled)b.click();return;}
    const k='1234abcd'.indexOf(ch);
    if(k>=0){const b=$('.opt[data-i="'+(k%4)+'"]');if(b&&!b.disabled)b.click();}
  }
});
const fullRow=(markText,spokenText)=>`<div class="full">${sayBtn(spokenText,'mini')}<p>${fmt(markText)}</p></div>`;

/* ---------- RENDERERS ---------- */
R.mcq=(q,body)=>{
  let opts=q.options.map((t,i)=>({t,c:i===q.answer}));
  if(!q.fixed)opts=shuffle(opts);
  body.innerHTML=`<div class="pr">${sayBtn(q.prompt.replace(/\n/g,' '))}<div class="prompt">${fmt(q.prompt)}</div></div>
  <div class="opts">${opts.map((o,i)=>`<div class="opt-row"><button class="opt" type="button" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span class="t">${esc(o.t)}</span></button>${sayBtn(o.t,'mini')}</div>`).join('')}</div>${ctlRow({})}`;
  const btns=[...body.querySelectorAll('.opt')];
  const maxH=Math.max(0,opts.length-2);let hints=0;
  setHint(maxH,'Remove one wrong option');
  function finish(i,revealed){
    btns.forEach((x,j)=>{x.disabled=true;if(opts[j].c)x.classList.add('correct');});
    if(i!==null&&!opts[i].c)btns[i].classList.add('wrong');
    const right=opts.find(o=>o.c).t;
    const ft=filledText(q.prompt,right);
    done({ok:i!==null&&opts[i].c,hint:hints>0,revealed},ft?fullRow(filledMark(q.prompt,right),ft):'',ft);
  }
  btns.forEach((b,i)=>b.onclick=()=>{if(!S.answered)finish(i,false);});
  $('#hb').onclick=()=>{
    if(S.answered||hints>=maxH)return;
    const cand=btns.map((b,i)=>i).filter(i=>!opts[i].c&&!btns[i].disabled);
    if(!cand.length)return;
    const i=pick(cand);btns[i].disabled=true;btns[i].classList.add('out');
    hints++;setHint(maxH-hints,'Remove one wrong option');
  };
  $('#sa').onclick=()=>{if(!S.answered)finish(null,true);};
};

function slotHTML(str){
  const m=/\s{3}\(([^)]*)\)$/.exec(str);
  const core=m?str.slice(0,m.index):str;
  const w=core.split(/ {5}/).map(wd=>`<span class="hw">${wd.split(' ').map(c=>c==='_'?'<i class="slot"></i>':`<i class="slot f">${esc(c)}</i>`).join('')}</span>`).join('');
  return w+(m?`<span class="si">${esc(m[1])}</span>`:'');
}
R.type=(q,body)=>{
  const a0=q.answers[0];
  const words=a0.split(' ');
  const levels=[
    ()=>words.map(w=>'_ '.repeat(w.length).trim()).join('     ')+`   (${words.length} word${words.length>1?'s':''}, ${a0.replace(/ /g,'').length} letters)`,
    ()=>words.map(w=>w.charAt(0)+' _'.repeat(Math.max(w.length-1,0))).join('     '),
    ()=>words.map(w=>w.split('').map((c,i)=>(i%2===0||i===w.length-1)?c:'_').join(' ')).join('     ')
  ];
  let hints=0;
  body.innerHTML=`<div class="pr">${sayBtn(q.prompt)}<div class="prompt">${fmt(q.prompt)}</div></div>${q.clue?`<div class="clue">Clue: ${esc(q.clue)}</div>`:''}
  <input id="inp" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Type your answer" aria-label="Your answer">
  <div class="hint" id="ho"></div>${ctlRow({check:true})}`;
  const inp=$('#inp');
  try{inp.focus();}catch(e){}
  setHint(levels.length,'Reveal more of the answer each time');
  $('#hb').onclick=()=>{
    if(S.answered||hints>=levels.length)return;
    $('#ho').innerHTML=slotHTML(levels[hints]());$('#ho').setAttribute('aria-label',levels[hints]().replace(/_/g,'blank'));hints++;
    setHint(levels.length-hints,'Reveal more of the answer each time');
    inp.focus();
  };
  function end(ok,revealed,typed,msg){
    inp.disabled=true;$('#chk').disabled=true;
    if(revealed)inp.value=a0;
    inp.classList.add(ok?'okc':'badc');
    let extra='';
    if(!ok&&!revealed)extra+=`<p class="exp">You typed: <s>${esc(typed)}</s></p>`;
    const ft=filledText(q.prompt,a0);
    extra+=fullRow(filledMark(q.prompt,a0),ft)+(q.answers.length>1?`<p class="exp">Also accepted: ${q.answers.slice(1).map(esc).join(', ')}</p>`:'');
    done({ok,hint:hints>0,revealed,msg},extra,ft);
  }
  $('#chk').onclick=()=>{
    if(S.answered)return;
    const v=inp.value;if(!norm(v))return;
    const ok=q.answers.some(a=>canon(a)===canon(v));
    let close=false;
    if(!ok)close=q.answers.some(a=>{const x=canon(a),y=canon(v);return x.length>=5&&lev(x,y)<=1;});
    end(ok,false,v,close?'So close. Check the spelling':'');
  };
  $('#sa').onclick=()=>{if(!S.answered)end(false,true,'','');};
};

R.cloze=(q,body)=>{
  const n=q.answers.length;
  const bank=shuffle(q.bank.map((t,i)=>({t,i})));
  const fill=Array(n).fill(null);
  const locked=new Set();
  const ansIdx=q.answers.map(a=>q.bank.findIndex(b=>b.toLowerCase()===a.toLowerCase()));
  const distract=q.bank.map((b,i)=>i).filter(i=>!ansIdx.includes(i));
  let active=0,checked=false,dimmed=false,used=false;
  const lines=q.text.split('\n').map(l=>{
    let h=esc(l).replace(/^([A-Z][A-Za-z ]{0,13}):\s/,'<b class="spk">$1:</b> ');
    h=h.replace(/\{(\d)\}/g,(m,k)=>`<button class="gap" type="button" data-g="${k-1}"></button>`);
    return `<p class="line">${h}</p>`;
  });
  const gapSay=q.text.split('\n').map(stripSpk).join(' ').replace(/\{\d\}/g,' blank ');
  body.innerHTML=`<div class="story-head">${sayBtn(gapSay)}<b>${esc(q.title)}</b></div><div class="story">${lines.join('')}</div><div class="bankwrap"><p class="bank-l"><span>Word bank</span><span class="cp" id="cprog"></span></p><div class="bank" id="bank"></div></div>${ctlRow({check:true})}`;
  const okAt=k=>fill[k]!==null&&q.bank[fill[k]].toLowerCase()===q.answers[k].toLowerCase();
  const firstFree=()=>{for(let j=0;j<n;j++)if(!locked.has(j)&&fill[j]===null)return j;return -1;};
  const firstOpen=()=>{for(let j=0;j<n;j++)if(!locked.has(j))return j;return 0;};
  const hintsLeft=()=>(distract.length&&!dimmed?1:0)+(n-locked.size);
  function paint(){
    body.querySelectorAll('.gap').forEach(g=>{
      const k=+g.dataset.g,f=fill[k];
      g.innerHTML=f===null?`<span class="gn">${k+1}</span>`:esc(q.caps.includes(k+1)?cap(q.bank[f]):q.bank[f]);
      g.className='gap'+(f===null?'':' filled')+(locked.has(k)?' locked':'')+(k===active&&!checked?' active':'')+(checked?(okAt(k)?' okc':' badc'):'');
    });
    $('#bank').innerHTML=bank.map(b=>{const out=dimmed&&distract.includes(b.i);return `<button class="chip${out?' out':''}" type="button" data-b="${b.i}" ${fill.includes(b.i)||checked||out?'disabled':''}>${esc(b.t)}</button>`;}).join('');
    $('#cprog').textContent=`${fill.filter(x=>x!==null).length} of ${n} placed`;
    $('#chk').disabled=checked||fill.some(x=>x===null);
    setHint(checked?0:hintsLeft(),'Narrow the choices, then fill gaps one by one');
  }
  body.querySelectorAll('.gap').forEach(g=>g.onclick=()=>{
    if(checked||S.answered)return;
    const k=+g.dataset.g;if(locked.has(k))return;
    fill[k]=null;active=k;paint();
  });
  $('#bank').onclick=e=>{
    const c=e.target.closest('.chip');if(!c||checked||c.disabled)return;
    let t=(!locked.has(active)&&fill[active]===null)?active:firstFree();
    if(t<0)t=locked.has(active)?-1:active;
    if(t<0)return;
    fill[t]=+c.dataset.b;
    const nx=firstFree();
    active=nx<0?t:nx;paint();
  };
  $('#hb').onclick=()=>{
    if(checked||S.answered||hintsLeft()<=0)return;
    used=true;
    if(distract.length&&!dimmed){dimmed=true;}
    else{
      const k=firstOpen();
      const c=ansIdx[k];const other=fill.indexOf(c);if(other>=0&&other!==k)fill[other]=null;
      fill[k]=c;locked.add(k);
      active=firstOpen();
    }
    paint();
  };
  function end(revealed){
    checked=true;
    const wrong=[];for(let k=0;k<n;k++)if(!okAt(k))wrong.push(k);
    paint();
    let full=q.text.split('\n').map(stripSpk).join(' ');
    q.answers.forEach((a,k)=>{full=full.replace('{'+(k+1)+'}','=='+(q.caps.includes(k+1)?cap(a):a)+'==');});
    const plain=full.replace(/==/g,'');
    done({ok:wrong.length===0,hint:used,revealed,mistakes:wrong.length,msg:(!revealed&&wrong.length)?`${n-wrong.length} of ${n} gaps correct`:''},fullRow(full,plain),plain);
  }
  $('#chk').onclick=()=>{if(S.answered||fill.some(x=>x===null))return;end(false);};
  $('#sa').onclick=()=>{if(S.answered)return;for(let k=0;k<n;k++)fill[k]=ansIdx[k];end(true);};
  paint();
};

R.reorder=(q,body)=>{
  const words=q.answer.split(' ');
  const pool=shuffle(words.map((w,i)=>({w,i})));
  let placed=[],checked=false,used=false;
  body.innerHTML=`<div class="rline" id="rl"></div><div class="bankwrap tray"><p class="bank-l"><span>Word bank</span><span class="cp" id="rprog"></span></p><div class="pool" id="pl"></div></div>${ctlRow({check:true,extra:`<button class="btn ghost" id="rs" type="button">${ICON.redo}<span>Start over</span></button>`})}`;
  const prefix=()=>{let m=0;while(m<placed.length&&placed[m].w===words[m])m++;return m;};
  function paint(cls){
    $('#rl').innerHTML=placed.length?placed.map(p=>`<button class="tile on ${cls||''}" type="button" data-p="${p.i}">${esc(p.w)}</button>`).join(''):'<span class="ph">Your sentence will appear here</span>';
    $('#pl').innerHTML=pool.map(p=>`<button class="tile" type="button" data-p="${p.i}" ${placed.includes(p)?'hidden':''}>${esc(p.w)}</button>`).join('');
    $('#rprog').textContent=`${placed.length} of ${words.length} placed`;
    $('#chk').disabled=checked||placed.length!==words.length;
    $('#rs').disabled=checked;
    setHint(checked?0:words.length-prefix(),'Place the next correct word');
  }
  $('#pl').onclick=e=>{const b=e.target.closest('.tile');if(!b||checked)return;const it=pool.find(p=>p.i===+b.dataset.p);if(it&&!placed.includes(it)){placed.push(it);paint();}};
  $('#rl').onclick=e=>{const b=e.target.closest('.tile');if(!b||checked)return;placed=placed.filter(p=>p.i!==+b.dataset.p);paint();};
  $('#rs').onclick=()=>{if(!checked){placed=[];paint();}};
  $('#hb').onclick=()=>{
    if(checked||S.answered)return;
    const m=prefix();if(m>=words.length)return;
    placed=placed.slice(0,m);
    const it=pool.find(p=>p.w===words[m]&&!placed.includes(p));
    if(it){placed.push(it);used=true;}
    paint();
  };
  function end(ok,revealed){
    checked=true;
    paint(ok?'okc':'badc');
    done({ok,hint:used,revealed},fullRow('=='+q.answer+'==',q.answer),q.answer);
  }
  $('#chk').onclick=()=>{
    if(S.answered||placed.length!==words.length)return;
    const s=norm(placed.map(p=>p.w).join(' '));
    end([q.answer].concat(q.alts||[]).some(a=>norm(a)===s),false);
  };
  $('#sa').onclick=()=>{
    if(S.answered)return;
    const left=pool.slice();placed=words.map(w=>{const k=left.findIndex(p=>p.w===w);return left.splice(k,1)[0];});
    end(true,true);
  };
  paint();
};

R.match=(q,body)=>{
  const PR=q.pairs;
  const order=shuffle(PR.map((p,i)=>i));
  let sel=null,mistakes=0,hints=0;const matched=new Set(),missed=new Set(),shown=new Set();
  body.innerHTML=`<div class="mwrap" id="mw"><svg class="mlines" id="mln" aria-hidden="true"></svg><div class="mcols"><div class="mcol" id="ml">${PR.map((p,i)=>`<div class="mrow">${sayBtn(p[0],'mini')}<button class="mi" type="button" data-i="${i}">${esc(p[0])}</button></div>`).join('')}</div><div class="mcol" id="mr">${order.map(i=>`<div class="mrow"><button class="mi" type="button" data-i="${i}">${esc(PR[i][1])}</button></div>`).join('')}</div></div></div><div class="mfoot"><span class="mnote" id="mm">Pick a phrase on the left first. Tap the speaker to hear it.</span><span class="cp" id="mc"></span></div>${ctlRow({})}`;
  const L=[...body.querySelectorAll('#ml .mi')],Rr=[...body.querySelectorAll('#mr .mi')];
  const wrap=$('#mw'),svg=$('#mln');
  const left=()=>PR.length-matched.size;
  const paths=new Map();
  const pairEl=i=>[L.find(x=>+x.dataset.i===i),Rr.find(x=>+x.dataset.i===i)];
  function pathD(i){
    const [l,r]=pairEl(i),w=wrap.getBoundingClientRect(),a=l.getBoundingClientRect(),b=r.getBoundingClientRect();
    const x1=a.right-w.left,y1=a.top+a.height/2-w.top,x2=b.left-w.left,y2=b.top+b.height/2-w.top,h=(x2-x1)*.5;
    return `M${x1} ${y1}C${x1+h} ${y1} ${x2-h} ${y2} ${x2} ${y2}`;
  }
  function lay(){paths.forEach((el,i)=>el.setAttribute('d',pathD(i)));}
  function progress(){$('#mc').textContent=`${matched.size} of ${PR.length} matched`;wrap.classList.toggle('picking',sel!==null);}
  setHint(left(),'Match one pair for you');
  progress();
  if(typeof ResizeObserver!=='undefined')new ResizeObserver(lay).observe(wrap);
  function lock(i,viaHelp){
    const color=`var(--m${matched.size%6})`;
    matched.add(i);
    pairEl(i).forEach(el=>{el.className='mi done';el.style.setProperty('--mc',color);});
    const pe=document.createElementNS('http://www.w3.org/2000/svg','path');
    pe.setAttribute('pathLength','1');pe.style.stroke=color;pe.setAttribute('d',pathD(i));
    svg.appendChild(pe);paths.set(i,pe);
    if(viaHelp)shown.add(i);
  }
  L.forEach(b=>b.onclick=()=>{
    if(S.answered||matched.has(+b.dataset.i))return;
    const i=+b.dataset.i;
    sel=i;L.forEach(x=>x.classList.toggle('sel',x===b));
    $('#mm').textContent='Now pick the matching meaning on the right.';
    progress();
    if(SET.auto)say(PR[i][0],null);
  });
  Rr.forEach(b=>b.onclick=()=>{
    if(S.answered)return;
    const i=+b.dataset.i;if(matched.has(i))return;
    if(sel===null){$('#mm').textContent='Pick a phrase on the left first.';return;}
    if(sel===i){
      lock(i,false);sel=null;L.forEach(x=>x.classList.remove('sel'));$('#mm').textContent='Match!';
      setHint(left(),'Match one pair for you');progress();
      if(matched.size===PR.length)finish(false);
    }else{
      mistakes++;missed.add(sel);
      b.classList.add('shake','bad');setTimeout(()=>b.classList.remove('shake','bad'),450);
      $('#mm').textContent='Not a match. Try again.';
    }
  });
  $('#hb').onclick=()=>{
    if(S.answered||left()<=0)return;
    const i=sel!==null&&!matched.has(sel)?sel:PR.map((p,k)=>k).find(k=>!matched.has(k));
    lock(i,true);hints++;sel=null;L.forEach(x=>x.classList.remove('sel'));
    $('#mm').textContent='One pair matched for you.';
    setHint(left(),'Match one pair for you');progress();
    if(matched.size===PR.length)finish(false);
  };
  $('#sa').onclick=()=>{
    if(S.answered)return;
    PR.forEach((p,i)=>{if(!matched.has(i))lock(i,true);});
    sel=null;L.forEach(x=>x.classList.remove('sel'));progress();$('#mm').textContent='Here are all the pairs.';
    finish(true);
  };
  function finish(revealed){
    let retryQ=null;
    const again=new Set([...missed,...shown]);
    if(again.size>0){
      const sub=[...again].sort().map(i=>PR[i]);
      const others=PR.filter((p,i)=>!again.has(i));
      while(sub.length<3&&others.length)sub.push(others.shift());
      retryQ=Object.assign({},q,{pairs:sub});
    }
    const extra=`<ul class="exl">${PR.map(p=>`<li><div class="eh"><b>${esc(p[0])}</b>${sayBtn(p[0],'mini')}</div>${SET.vi&&viOf(p[0])?viLine(viOf(p[0])):`<div class="em">${esc(p[1])}</div>`}<div class="el"><i>${hlWords(p[2],p[0])}</i>${sayBtn(p[2],'mini')}</div></li>`).join('')}</ul>`;
    const assisted=hints>0||shown.size>0;
    done({ok:true,hint:assisted,revealed,mistakes,retryQ,msg:mistakes&&!revealed?`All matched, with ${mistakes} wrong ${mistakes===1?'try':'tries'}`:''},extra,null);
  }
};

/* ---------- SUMMARY ---------- */
function qShort(q){
  let t;
  if(q.type==='match')t='Matching: '+q.title;
  else if(q.type==='cloze')t=q.title;
  else if(q.type==='reorder')t='Reorder the sentence';
  else t=q.prompt.replace(/\n/g,' ').replace(/\[([A-D]):\s*([^\]]+)\]/g,'$2');
  t=t.replace(/\*\*|==/g,'').replace(/\*([^*\n]+?)\*/g,'$1');
  return t.length>130?t.slice(0,127)+'…':t;
}
function qAns(q){
  if(q.type==='match')return 'Review: '+q.pairs.map(p=>p[0]).join(', ');
  if(q.type==='cloze')return q.answers.join(', ');
  if(q.type==='reorder')return q.answer;
  if(q.type==='type')return q.answers[0];
  return q.options[q.answer];
}
function qSay(q){
  if(q.type==='match')return '';
  if(q.type==='cloze'){let t=q.text.split('\n').map(stripSpk).join(' ');q.answers.forEach((a,k)=>{t=t.replace('{'+(k+1)+'}',a);});return t;}
  if(q.type==='reorder')return q.answer;
  const a=qAns(q);
  return filledText(q.prompt,a)||a;
}
function summary(){
  app.style.removeProperty('--sc');
  const Rs=S.results,total=Rs.length,good=Rs.filter(r=>r.ok).length,pct=total?Math.round(good/total*100):0;
  if(S.stageId){P.best[S.stageId]=Math.max(P.best[S.stageId]||0,pct);persist();}
  const tags={};Rs.forEach(r=>{const t=tags[r.tag]=tags[r.tag]||{n:0,g:0};t.n++;if(r.ok)t.g++;});
  const bad=Rs.filter(r=>!r.ok);
  const rec=S.retries.filter(r=>r.ok).length;
  const hinted=Rs.filter(r=>r.hint&&!r.revealed).length,shown=Rs.filter(r=>r.revealed).length;
  const weak=Object.keys(tags).filter(k=>tags[k].n>=2&&tags[k].g/tags[k].n<0.7).sort((a,b)=>tags[a].g/tags[a].n-tags[b].g/tags[b].n);
  const msg=pct>=90?'Excellent. Try Smart review in a day or two to test your long-term memory.':pct>=70?'Good work. Look at the questions below, then retry them while they are fresh.':'This takes repetition, and that is normal. Run this stage again and try to recall each answer before using hints.';
  app.innerHTML=`
  <div class="qtop"><button class="icon-btn" id="home-btn" type="button" aria-label="Back to menu">${ICON.back}</button><div class="qt"><div class="stg">${esc(S.name)}</div><div class="cnt">Results</div></div>${soundBtn()}</div>
  <div class="sgrid"><div>
  <main class="sheet">
   <div class="sumtop">
    <div class="ring" style="--rc:${pct>=90?'var(--ok)':pct>=70?'var(--pri)':'var(--m1)'}" role="img" aria-label="${pct} percent"><svg viewBox="0 0 120 120" aria-hidden="true"><circle class="tr" cx="60" cy="60" r="52"/><circle class="pg" cx="60" cy="60" r="52" style="stroke-dashoffset:${(326.7*(1-pct/100)).toFixed(1)}"/></svg><span class="big-pct">${pct}%</span></div>
    <div class="sumtxt"><p class="sum-h">You got <b>${good} of ${total}</b> right on the first try</p>
     <div class="dots" aria-hidden="true">${Rs.map(r=>`<i class="${r.ok?'ok':''}"></i>`).join('')}</div></div>
   </div>
   <p class="muted">${msg}</p>
   ${(hinted||shown)?`<p class="muted">Help used: hints on ${hinted} question${hinted===1?'':'s'}, answers revealed on ${shown}. Questions that needed help count as not yet learned.</p>`:''}
   ${S.retries.length?`<p class="muted">Second looks: you recovered ${rec} of ${S.retries.length}.</p>`:''}
  </main>
  <h2>By skill</h2>
  <div class="sheet">${Object.keys(tags).map(k=>{const t=tags[k],p=Math.round(t.g/t.n*100);return `<div class="tagrow"><span>${esc(k)}</span><span class="meter"><i style="width:${p}%"></i></span><span>${t.g}/${t.n}</span></div>`;}).join('')}
  ${weak.length?`<p class="muted">Worth more practice: <b>${weak.map(esc).join(', ')}</b></p>`:''}</div>
  </div><div>
  ${bad.length?`<h2>Questions to review (${bad.length})</h2><div class="sheet"><ul class="wl">${bad.map(r=>{const sx=qSay(r.q);return `<li>${sx?sayBtn(sx,'mini'):''}<div class="tx">${esc(qShort(r.q))}<small>Answer: <b>${esc(qAns(r.q))}</b></small></div></li>`;}).join('')}</ul></div>`:''}
  <div class="review-row" style="margin-top:18px">${bad.length?'<button class="btn primary" id="again" type="button">Retry these questions</button>':'<button class="btn primary" id="repeat" type="button">Practise this stage again</button>'}<button class="btn" id="menu" type="button">Back to menu</button></div>
  </div></div>`;
  bindSound();
  const a=$('#again');if(a)a.onclick=()=>start('Retry mistakes',shuffle(bad.map(r=>BYID[r.q.id])),null);
  const rp=$('#repeat');if(rp)rp.onclick=()=>{
    if(S.stageId)launchStage(S.stageId);else start(S.name,smartMix(20),null);
  };
  $('#menu').onclick=home;$('#home-btn').onclick=home;
  window.scrollTo(0,0);
}

window.__ws={cur:()=>S&&S.queue[S.i],state:()=>S,start,home};
home();
})();
</script>
