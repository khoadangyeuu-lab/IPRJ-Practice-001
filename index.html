<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phrase Practice</title>
<style>
:root{
  color-scheme:light dark;
  --paper:#F4F6FB;--sheet:#FFFFFF;--ink:#101733;--ink2:#566082;--line:#DCE1F0;
  --pri:#2C3BFF;--pri-ink:#FFFFFF;--pri-soft:#E8EBFF;
  --hl:rgba(255,205,0,.78);
  --m0:#0E8F6E;--m1:#D9480F;--m2:#8B3FD9;--m3:#D6336C;--m4:#0B8FB5;--m5:#A16207;
  --s0:var(--pri);--s1:var(--m0);--s2:var(--m1);--s3:var(--m2);--s4:var(--m3);--s5:var(--m5);
  --hero:#2C3BFF;
  --ok:#10795A;--ok-soft:#DDF4EA;--bad:#B93228;--bad-soft:#FDE7E4;--warn:#7D5200;--warn-soft:#FFF0C7;
  --shadow:0 1px 0 var(--line),0 22px 44px -30px rgba(16,23,51,.45);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Charter,"Bitstream Charter",Georgia,serif;
  --sans:"Avenir Next","Segoe UI Variable","Segoe UI",Inter,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#0C0F1F;--sheet:#151934;--ink:#EDEFFC;--ink2:#9EA6C8;--line:#2A3053;
  --pri:#8F9BFF;--pri-ink:#0C0F1F;--pri-soft:#232A5A;
  --hl:rgba(255,205,0,.36);
  --m0:#5BD6A4;--m1:#FF9A63;--m2:#C79BFF;--m3:#FF8FB8;--m4:#58CFF0;--m5:#F3C550;
  --hero:#2A36D6;
  --ok:#5BD6A4;--ok-soft:#10322B;--bad:#FF9188;--bad-soft:#3A1F24;--warn:#F3C550;--warn-soft:#352C10;
  --shadow:0 1px 0 var(--line),0 22px 44px -30px rgba(0,0,0,.8);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:18px/1.6 var(--sans)}
#app{max-width:1560px;margin:0 auto;padding:24px 48px 96px}
.homegrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:64px;align-items:start}
.homegrid .hero{position:sticky;top:48px;padding:56px 0 24px}
.homeside h2:first-child{margin-top:34px}
.qgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:24px;align-items:start}
.side{position:sticky;top:20px;min-height:120px}
.side #fb{margin-top:0}
.tip{border:1.5px dashed var(--line);border-radius:22px;padding:24px 26px;color:var(--ink2);font-size:17px}
.tip b{color:var(--ink)}
.tip{padding:18px 20px!important}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tl li{display:flex;align-items:center;gap:10px;font-size:16px;line-height:1.35;color:var(--ink);white-space:nowrap}
.ti{flex:none;width:36px;height:36px;border-radius:12px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
kbd{font:600 13px/1 var(--sans);padding:3px 8px;border-radius:7px;border:1px solid var(--line);background:var(--sheet);color:var(--ink2);box-shadow:0 1px 0 var(--line);margin-left:2px}

.ctl{justify-content:flex-start;gap:8px;margin-top:20px}
.ctl .grow{flex:1}
.ctl .btn{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;font-size:16.5px}
.ctl .btn svg{width:18px;height:18px;flex:none}
.ctl .btn.ghost svg{color:var(--sc,var(--pri))}
.sheet .ctl{margin-top:26px;padding-top:20px;border-top:1px solid var(--line)}
.ctl .btn.primary{padding:12px 28px}
.opt.out{opacity:.35;text-decoration:line-through}
.btn.ghost:disabled{border-style:dashed}
.tip p{margin:6px 0}
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.sgrid h2:first-child{margin-top:8px}
@media (max-width:1000px){
  #app{max-width:880px;padding:18px 24px 90px}
  .homegrid,.qgrid,.sgrid{grid-template-columns:minmax(0,1fr);gap:0}
  .homegrid .hero{position:static;padding:30px 0 10px}
  .homeside h2:first-child{margin-top:26px}
  .side{position:static;min-height:0}
  .side #fb{margin-top:16px}
  .tip{display:none}
  .sgrid h2:first-child{margin-top:30px}
}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
mark{background:linear-gradient(transparent 56%,var(--hl) 56%);color:inherit;padding:0 1px;border-radius:2px}
.no-tts .say{display:none!important}

/* top bars */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{font-family:var(--serif);font-weight:700;font-size:26px;letter-spacing:-.01em}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--sheet);display:grid;place-items:center;cursor:pointer;flex:none}
.icon-btn:hover{border-color:var(--pri)}
.snd-wrap{position:relative}
.snd{position:absolute;right:0;top:50px;width:340px;background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 18px 50px -12px rgba(16,23,51,.35);z-index:30}
.snd-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0}
.snd-row+.snd-row{border-top:1px solid var(--line)}
.snd-row>span{font-size:16.5px}
.segc{display:flex;background:var(--paper);border-radius:11px;padding:3px;gap:2px}
.segc button{border:0;background:transparent;padding:7px 13px;border-radius:9px;font-size:15.5px;cursor:pointer;color:var(--ink2)}
.segc button.on{background:var(--sheet);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(16,23,51,.2)}
.sw{width:46px;height:27px;border-radius:99px;border:0;background:var(--line);position:relative;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .18s}
.sw.on{background:var(--pri)}.sw.on::after{transform:translateX(19px)}
.snd-note{font-size:14.5px;color:var(--ink2);margin:6px 0 0}

/* audio buttons */
.say{width:48px;height:48px;border-radius:50%;border:0;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;cursor:pointer;flex:none;transition:background .15s,transform .1s}
.say:hover{background:var(--pri);color:var(--pri-ink)}
.say:active{transform:scale(.94)}
.say.mini{width:38px;height:38px}.say.mini svg{width:19px;height:19px}
.say.big{width:60px;height:60px;background:var(--pri);color:var(--pri-ink)}
.say.big svg{width:28px;height:28px}
.say.big:hover{filter:brightness(1.1)}
.say.playing{background:var(--pri);color:var(--pri-ink)}
.say.playing .w{animation:wv .7s ease-in-out infinite}
.say.playing .w2{animation-delay:.18s}
@keyframes wv{0%,100%{opacity:.25}50%{opacity:1}}

/* home */
.hero{padding:30px 0 26px}
.term-row{display:flex;align-items:center;gap:18px}
.term{font-family:var(--serif);font-weight:700;font-size:clamp(34px,4.6vw,58px);line-height:1.08;letter-spacing:-.02em;margin:0;min-width:0;flex:1;overflow-wrap:anywhere}
.hero .def{font-size:21px;color:var(--ink2);margin:14px 0 8px;max-width:34em}
.hero .eg{font-family:var(--serif);font-style:italic;font-size:23px;line-height:1.55;margin:0 0 4px;max-width:30em}
.eg-row{display:flex;gap:10px;align-items:flex-start}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.vi{display:block;margin-top:3px;color:var(--ink2);font-size:.94em;line-height:1.45}
.vl{display:inline-block;margin-right:7px;padding:0 6px;border-radius:5px;background:var(--pri-soft);color:var(--pri);font:700 11px/17px var(--sans);font-style:normal;letter-spacing:.03em;vertical-align:1px}
.vi-hero{margin:6px 0 0;font-size:19px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:44px;max-width:560px}
.st{display:grid;align-content:start;gap:2px;justify-items:start;padding:16px 18px;border:1px solid var(--line);border-radius:20px;background:var(--sheet);box-shadow:0 3px 0 var(--line)}
.st .si{display:grid;place-items:center;width:36px;height:36px;margin-bottom:8px;border-radius:12px;background:var(--pri-soft);color:var(--pri)}
.st b{font-family:var(--serif);font-size:32px;line-height:1.1;letter-spacing:-.01em}
.st b small{font:600 16px var(--sans);color:var(--ink2);letter-spacing:0}
.st>span:last-child{font-size:15px;color:var(--ink2)}
.btn{padding:14px 26px;border-radius:14px;border:1.5px solid var(--line);background:var(--sheet);font-weight:650;cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--pri)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:var(--pri-ink);box-shadow:0 10px 22px -12px var(--pri)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;margin-top:16px;padding:14px}
.btn.sm{padding:7px 14px;font-size:16px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:default}
h2{font-size:25px;margin:30px 0 12px;font-family:var(--serif);letter-spacing:-.01em}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative}
.route li:not(:last-child)::before{content:"";position:absolute;left:24px;top:54px;bottom:-8px;width:2px;background:var(--line)}
.stage{display:flex;gap:16px;align-items:center;width:100%;text-align:left;padding:10px 10px 10px 0;margin:0 0 8px;border:0;border-radius:14px;background:transparent;cursor:pointer}
.stage:hover:not(:disabled){background:var(--sheet)}
.node{flex:none;width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--sheet);border:2px solid var(--line);font-weight:700;font-family:var(--serif);font-size:21px;position:relative;z-index:1}
.node{border-color:color-mix(in srgb,var(--sc,var(--pri)) 40%,var(--line));color:var(--sc,var(--pri))}
.node.done{background:var(--sc,var(--ok));border-color:var(--sc,var(--ok));color:var(--sheet)}
.node.next{border-color:var(--sc,var(--pri));box-shadow:0 0 0 5px color-mix(in srgb,var(--sc,var(--pri)) 18%,transparent)}
.stage .s{flex:1;min-width:0}.stage .s b{display:block;font-size:20px}.stage .s small{color:var(--ink2);font-size:16px}
.stage .sm{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:14.5px;color:var(--ink2);white-space:nowrap}
.mini-meter{width:90px;height:5px;border-radius:9px;background:var(--line);overflow:hidden;display:block}.mini-meter i{display:block;height:100%;background:var(--sc,var(--ok))}
.review-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:30px}
.h2row h2{margin:0 0 12px}
.h2row .muted{margin:0 0 12px;font-size:15.5px}
.acts{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.acts .stage{margin:0;padding:18px 22px;background:var(--sheet);border:1px solid var(--line);border-radius:18px;transition:border-color .15s,transform .12s}
.acts .stage:hover:not(:disabled){border-color:var(--pri);background:var(--sheet);transform:translateY(-1px)}
.acts .stage:disabled{cursor:default}
.acts .stage:disabled .s b{color:var(--ink2)}
.node.ic{border:0;border-radius:14px;background:var(--pri-soft);color:var(--pri)}
.node.ic.warn{background:var(--warn-soft);color:var(--warn)}
.stage:disabled .node.ic{background:var(--paper);color:var(--ink2)}
.pill{min-width:30px;text-align:center;padding:3px 11px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:750;font-size:17px}
.pill.zero{background:var(--paper);color:var(--ink2);font-weight:600}
.foot{border-top:1px solid var(--line);padding-top:16px}
.foot{margin-top:34px}
.link{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:15.5px;cursor:pointer;padding:0}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.qt{flex:1;min-width:0}
.stg{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cnt{color:var(--ink2);font-size:15px}
.progress{height:10px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:18px}
.progress i{display:block;position:relative;height:100%;background:var(--sc,var(--pri));border-radius:99px;transition:width .35s}
.progress i::after{content:"";position:absolute;right:0;top:0;bottom:0;width:12px;border-radius:99px;background:#FFCD00}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:28px;padding:34px 34px 30px;box-shadow:var(--shadow)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:14.5px;font-weight:650;padding:3px 11px;border-radius:99px;background:color-mix(in srgb,var(--sc,var(--pri)) 14%,var(--sheet));color:var(--sc,var(--pri))}
.tag.retry{background:var(--warn-soft);color:var(--warn)}
.instr{font-size:15.5px;color:var(--ink2)}
.pr{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.prompt{font-family:var(--serif);font-size:26px;line-height:1.6;flex:1;min-width:0}
.blank{display:inline-block;min-width:5.2em;height:1.15em;margin:0 3px;vertical-align:text-bottom;border-bottom:3px solid var(--pri);border-radius:7px 7px 0 0;background:var(--pri-soft)}
.sg{white-space:nowrap}.sg b{font-family:var(--sans);font-size:11px;vertical-align:super;margin-right:2px;color:var(--pri)}.sg u{text-underline-offset:4px}
.clue{font-size:16.5px;color:var(--ink2);margin:-6px 0 14px}
.opts{display:grid;gap:10px}
.opt-row{display:flex;gap:8px;align-items:center}
.opt{flex:1;display:flex;gap:14px;align-items:center;text-align:left;padding:16px 20px;border:1.5px solid var(--line);background:var(--sheet);border-radius:16px;box-shadow:0 3px 0 var(--line);font-size:19px;cursor:pointer;min-width:0;transition:transform .12s,border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--pri);background:var(--pri-soft);transform:translateX(3px)}
.opt:disabled{cursor:default;opacity:1}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:16px}
.opt .t{overflow-wrap:anywhere}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);box-shadow:0 3px 0 var(--ok)}.opt.correct .k{background:var(--ok);color:#fff}
.opt.correct::after,.opt.wrong::after{margin-left:auto;font-weight:800;font-size:21px;line-height:1}
.opt.correct::after{content:"\2713";color:var(--ok)}.opt.wrong::after{content:"\2715";color:var(--bad)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}.opt.wrong .k{background:var(--bad);color:#fff}
input#inp{width:100%;padding:17px 20px;font:inherit;font-size:25px;font-family:var(--serif);border:1.5px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink)}
input#inp.okc{border-color:var(--ok);background:var(--ok-soft)}input#inp.badc{border-color:var(--bad);background:var(--bad-soft)}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.hint{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 22px;min-height:8px;margin-top:6px;color:var(--ink2)}
.hint:not(:empty){margin-top:16px}
.hw{display:inline-flex;gap:5px}
.slot{display:inline-grid;place-items:end center;width:27px;height:38px;border-bottom:3px solid var(--ink2);font:600 26px/1.15 var(--serif);font-style:normal}
.slot.f{border-color:var(--pri);color:var(--pri)}
.hint .si{font-size:16px}
.mwrap{position:relative}
.mlines{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.mlines path{fill:none;stroke-width:4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:0;animation:draw .45s ease-out}
@keyframes draw{from{stroke-dashoffset:1}}
.mcols{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);column-gap:76px;align-items:start}
.mcol{display:grid;gap:12px;align-content:start}
.mrow{display:flex;gap:8px;align-items:center}
.mi{position:relative;flex:1;min-width:0;min-height:60px;display:flex;align-items:center;padding:12px 18px;border:1.5px solid var(--line);border-radius:16px;background:var(--sheet);box-shadow:0 3px 0 var(--line);font:inherit;font-size:18px;line-height:1.4;color:var(--ink);text-align:left;cursor:pointer;overflow-wrap:anywhere;transition:border-color .15s,background .15s,transform .12s}
.mi::after{content:"";position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;border-radius:50%;border:3px solid var(--line);background:var(--sheet);transition:background .15s,border-color .15s}
#ml .mi::after{right:-8px}#mr .mi::after{left:-8px}
#ml .mi{font-weight:650}
#mr .mi{padding-left:26px}
.mi:hover:not(.done){border-color:var(--pri)}
.mwrap.picking #mr .mi:not(.done)::after{border-color:var(--pri)}
.mwrap.picking #mr .mi:not(.done):hover{background:var(--pri-soft)}
.mi.sel{border-color:var(--pri);background:var(--pri-soft);box-shadow:0 3px 0 var(--pri)}
.mi.sel::after{background:var(--pri);border-color:var(--pri)}
.mi.done,#mr .mi.done{padding-left:52px;border-color:var(--mc);background:color-mix(in srgb,var(--mc) 11%,var(--sheet));box-shadow:0 3px 0 color-mix(in srgb,var(--mc) 45%,var(--line));cursor:default}
.mi.done::before{content:"\2713";position:absolute;left:14px;top:50%;margin-top:-13px;width:26px;height:26px;border-radius:50%;background:var(--mc);color:var(--sheet);display:grid;place-items:center;font-size:15px;font-weight:800;line-height:1}
.mi.done::after{background:var(--mc);border-color:var(--mc)}
.mi.bad{border-color:var(--bad);background:var(--bad-soft);box-shadow:0 3px 0 var(--bad)}
.mi.bad::after{border-color:var(--bad)}
.mfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;flex-wrap:wrap}
.cp{padding:2px 12px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:15.5px;font-weight:650;white-space:nowrap}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.mnote{font-size:16.5px;color:var(--ink2);min-height:1.4em}
em{font-style:italic;font-weight:600}
.story{padding:20px 26px 10px;border:1px solid var(--line);border-left:5px solid var(--hl);border-radius:18px;background:var(--paper)}
.story .line{margin:0 0 8px;font-family:var(--serif);font-size:23px;line-height:2}
.spk{color:var(--pri);font-family:var(--sans);font-size:17px;font-weight:700;margin-right:4px}
.story-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.story-head b{font-size:20px}
.gap{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;min-width:124px;height:40px;margin:0 3px;padding:0 16px;border:2px dashed var(--pri);border-radius:11px;background:var(--sheet);color:var(--pri);font-family:var(--sans);font-size:19px;font-weight:650;line-height:1;cursor:pointer;transition:background .15s,border-color .15s}
.gap:hover{background:var(--pri-soft)}
.gn{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:14px;font-weight:700}
.gap.filled{border-style:solid;background:var(--pri-soft)}
.gap.active{outline:3px solid var(--pri);outline-offset:2px;background:var(--sheet)}
.gap.filled.active{background:var(--pri-soft)}
.gap.locked{border-style:solid;border-color:var(--warn);background:var(--warn-soft);color:var(--warn);cursor:default}
.gap.okc{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.gap.badc{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.bankwrap{margin-top:18px;padding:16px 18px 18px;border-radius:18px;background:var(--pri-soft)}
.bank-l{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px;font-size:15.5px;font-weight:650;color:var(--ink2)}
.bank-l .cp{background:var(--sheet)}
.bank{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 20px;border-radius:12px;border:1.5px solid var(--line);background:var(--sheet);box-shadow:0 3px 0 var(--line);font-size:18px;font-weight:600;color:var(--ink);cursor:pointer;transition:transform .1s,border-color .15s}
.chip:hover:not(:disabled){border-color:var(--pri);transform:translateY(-1px)}
.chip:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

<script id="data">
const STAGES=[
 {id:'meaning',title:'Meanings',sub:'Match phrases to definitions'},

];
const BANK=[];
const add=o=>{BANK.push(o)};
const mt=(id,tag,title,pairs)=>add({id,stage:'meaning',type:'match',tag,title,pairs});

const cl=(id,tag,title,text,answers,bank,explain,caps)=>add({id,stage:'story',type:'cloze',tag,title,text,answers,bank,explain,vocab:[],caps:caps||[]});
const ro=(id,answer,explain,alts)=>add({id,stage:'grammar',type:'reorder',tag:'Grammar',answer,alts:alts||[],explain,vocab:[]});

/* ===== STAGE 1: MEANINGS ===== */
mt('m1','Idiom','Idioms, set 1',[
 ['sour grapes','pretending something is not worth having because you failed to get it',"Tom said the prize was rigged only after he lost. That's pure sour grapes."],
 ["one's cup of tea",'something you like or enjoy (usually used in the negative)',"Heavy metal isn't really my cup of tea."],
 ['have green fingers','be very good at growing plants','Grandma has green fingers. Her roses win prizes every year.'],
 ['full of beans','full of energy and enthusiasm',"After a good night's sleep, the kids were full of beans."],
 ['a jack of all trades','someone who can do many jobs but is not an expert at any of them','He is a jack of all trades and master of none.']]);
mt('m2','Idiom','Idioms, set 2',[
 ["breathe down one's neck",'watch someone too closely and put pressure on them','My boss keeps breathing down my neck about the deadline.'],
 ['on the straight and narrow','living honestly and obeying the law','After his release, he stayed on the straight and narrow.'],
 ['on the rocks','(of a relationship or business) in serious trouble and likely to fail','Their partnership has been on the rocks since the lawsuit.'],
 ['strike a happy medium','find a fair balance between two extremes','Try to strike a happy medium between saving and spending.'],
 ["of one's own accord",'willingly, without being forced or asked','The dog came back of its own accord.']]);
mt('m3','Idiom','Idioms, set 3',[
 ['fair and square','honestly and according to the rules','We won the match fair and square.'],
 ['safe and sound','unharmed; not hurt or damaged','The missing kitten was found safe and sound.'],
 ['part and parcel (of sth)','an essential part of something','Early mornings are part and parcel of farm life.'],
 ['out of character','not typical of how someone usually behaves','Shouting at a customer is out of character for Mai.'],
 ['not in the least','not at all',"“Am I disturbing you?” “Not in the least.”"]]);
mt('m4','Collocation','Collocations, set 1',[
 ['exert pressure on sb','try to influence someone by pushing them strongly','Voters exerted pressure on the council to act.'],
 ['take measures','do things officially to deal with a problem','The city took measures to cut air pollution.'],
 ['break the silence','be the first to speak or make a sound after a quiet period',"A baby's cry broke the silence."],
 ["stretch one's legs",'walk around after sitting for a long time','We stopped at a café to stretch our legs.'],
 ['a glow of satisfaction','a warm, happy look that shows you are pleased','A glow of satisfaction spread over her face.']]);
mt('m5','Collocation','Collocations, set 2',[
 ['hold a fascination for sb','be very interesting and attractive to someone','Space has always held a fascination for children.'],
 ['supremely confident','extremely sure of yourself','The champion looked supremely confident before the final.'],
 ['be inextricably linked','be connected so closely that they cannot be separated','Health and diet are inextricably linked.'],
 ['commit a crime','do something illegal','He denied that he had committed any crime.'],
 ["screw up one's face",'twist your face because you dislike something','She screwed up her face at the smell.']]);
mt('m6','Phrasal verb','Phrasal verbs',[
 ['bring up (a topic)','mention a subject for the first time in a conversation',"Please don't bring up the exam results at dinner."],
 ['mount up','gradually increase in amount','Small expenses mount up quickly.'],
 ['clock up','reach or achieve a total (miles, hours, points)','Pilots clock up thousands of flying hours.'],

mt('m7','Vocabulary','Easily confused verbs',[
 ['acquit sb (of sth)','decide officially in court that someone is not guilty','The jury acquitted her of all charges.'],
 ['liberate','set free (a person, a place or a people)','The army liberated the city in 1945.'],
 ['intern','imprison someone, usually in wartime, without a trial','Enemy nationals were interned during the war.'],
 ['exert','use strength, influence or pressure','Social media can exert a strong influence on teenagers.'],
 ['deploy','move troops or resources into position for action','The government deployed extra police at the stadium.']]);
mt('m8','Vocabulary','Words and prepositions',[
 ['comprise','consist of; be made up of','The team comprises ten engineers.'],
 ['be bent on doing sth','be determined to do something','He is bent on becoming a pilot.'],
 ['be inclined to do sth','tend to do something; feel likely to do it',"I'm inclined to accept the offer."],
 ['unappealing','not attractive or pleasant','The menu looked unappealing.'],
 ['nutritious','containing substances that help you stay healthy and grow','Beans are cheap and nutritious.']]);
mt('m9','Linkers','Linking words',[
 ['whereas','used to compare two facts that are different','Cats sleep all day, whereas dogs need walks.'],
 ['considering that','taking into account the fact that',"Considering that he's new, he's doing great."],
 ['nevertheless','in spite of that','It rained; nevertheless, we went out.'],
 ['likewise','in the same way','Mai donated books. Likewise, her brother gave clothes.'],
 ['consequently','as a result','Sales fell; consequently, prices were cut.']]);

mc('r1','meaning','Idiom','Which idiom describes **criticising something because you failed to get it**?',['sour grapes','green fingers','full of beans',"one's cup of tea"],'**Sour grapes** comes from the fable of the fox who could not reach the grapes and then said they were sour.',['sour grapes — criticising something because you failed to get it']);
mc('r2','meaning','Idiom',"Which expression means **to watch someone so closely that they feel pressure**?",["breathe down one's neck",'strike a happy medium',"stretch one's legs",'break the silence'],"Picture someone standing right behind you, breathing on your neck: **breathe down someone's neck**.",["breathe down one's neck — watch someone too closely"]);
mc('r3','meaning','Idiom',"What does **“part and parcel of sth”** mean?",['an essential part of something','unharmed and safe','honestly and fairly','a package sent by post'],"*Stress is part and parcel of this job* means stress cannot be separated from the job.",['part and parcel of sth — an essential part of something']);
mc('r4','meaning','Vocabulary',"What does **acquit** mean?",['declare officially that someone is not guilty','set someone free','imprison someone without a trial','forgive someone for something'],"To acquit is to find a defendant **not guilty**. Don't confuse it with *liberate* (set free) or *intern* (imprison without trial).",['acquit — declare officially that someone is not guilty','liberate — set free','intern — imprison without a trial']);
mc('r5','meaning','Idiom',"“It was **out of character** for him to shout.” What does this mean?",['Shouting is not typical of him','Shouting was beyond his ability','He shouted on purpose','He often shouts'],"**Out of character** = not like the person's usual behaviour.",['out of character — not typical of someone']);
mc('r6','meaning','Collocation',"What does **“stretch one's legs”** mean?",['walk around after sitting for a long time','run very fast','do yoga','make a trip longer'],"Use it after a long journey, meeting or flight.",["stretch one's legs — walk around after sitting for a long time"]);
mc('r7','meaning','Phrasal verb',"In “Nobody wanted to **bring up** the sensitive topic”, what does *bring up* mean?",['mention','raise a child','tolerate','gradually increase'],"With a topic, issue or subject, **bring up** = raise it for discussion. With a child it means *raise*.",['bring up sth — mention a topic','bring sb up — raise a child','put up with — tolerate']);
mc('r8','meaning','Idiom',"“Their marriage is **on the rocks**.” What state is it in?",['in serious trouble and likely to end','going very smoothly','living honestly','full of energy'],"Like a ship about to hit the rocks, the relationship is close to failure.",['on the rocks — close to failure']);

/* ===== STAGE 2: IN CONTEXT ===== */
mc('c1','context','Idiom',"Tom lost the debate contest. The next day he told everyone that debating is for nerds anyway. His sister rolled her eyes: “That's just ____. You wanted to win badly.”",['sour grapes','green fingers','full of beans','a cup of tea'],"Tom criticises something only because he failed to win it. That is **sour grapes**.",['sour grapes — criticising something because you failed to get it']);
mc('c2','context','Idiom',"My neighbour's balcony is a mini jungle: tomatoes, herbs, even orchids. Everything she touches grows. She really has ____.",['green fingers','sour grapes','a jack of all trades','full of beans'],"Everything she grows thrives, so she has **green fingers**. (American English: *a green thumb*.) There is no “a” before *green fingers*.",['have green fingers — be very good at gardening']);
mc('c3','context','Idiom',"Everyone loves the new horror movie, but I couldn't even finish it. Scary films just aren't my ____.",['cup of tea','green fingers','sour grapes','full of beans'],"**(not) my cup of tea** means (not) something I enjoy. It is usually used in the negative.",["one's cup of tea — something you like"]);
mc('c4','context','Idiom',"The twins had a huge sugary breakfast and are now racing around the living room. They are absolutely ____.",['full of beans','sour grapes','on the rocks','safe and sound'],"Racing around with lots of energy = **full of beans**.",['full of beans — full of energy']);
mc('c5','context','Idiom',"Mum texts me three times a day to ask if I've started my homework. I can't concentrate with her breathing down my ____.",['neck','back','shoulder','ear'],"It is a fixed idiom: **breathe down someone's neck**.",["breathe down one's neck — watch someone too closely"]);
mc('c6','context','Idiom',"Linh and Duc argued about money for months. They barely talk now, and friends say their friendship is ____.",['on the rocks','safe and sound','fair and square','part and parcel'],"A relationship close to collapse is **on the rocks**.",['on the rocks — close to failure']);
mc('c8','context','Idiom',"Two hikers vanished in the fog and the whole village feared the worst. Two days later, rescuers found them ____.",['safe and sound','fair and square','on the rocks','part and parcel'],"Found unharmed = **safe and sound**.",['safe and sound — unharmed']);
mc('c9','context','Idiom',"Nurses often work night shifts, miss holidays and skip meals. Honestly, that's ____ of the job.",['part and parcel','safe and sound','fair and square','on the rocks'],"**part and parcel of sth** = an essential part of it.",['part and parcel of sth — an essential part of something']);
mc('c10','context','Idiom',"Samira always arrives ten minutes early. So when she turned up two hours late without even calling, it was completely out of ____.",['character','habit','nature','custom'],"Behaviour that is not typical of someone is **out of character**.",['out of character — not typical of someone']);
mc('c12','context','Collocation',"We had been sitting on the coach for four hours, so when the driver announced a ten-minute break, everyone got off to ____ their legs.",['stretch','extend','lengthen','span'],"The collocation is **stretch one's legs**.",["stretch one's legs — walk around after sitting for a long time"]);
mc('c14','context','Phrasal verb',"The meeting was going smoothly until Ken ____ the sensitive issue of bonuses, and the room went quiet.",['brought up','put up','mounted up','clocked up'],"**bring up an issue** = raise it for discussion. *Put up with* means *tolerate*.",['bring up sth — mention a topic']);
mc('c15','context','Phrasal verb',"Han is a delivery driver. In just three months he has ____ 12,000 km on his old motorbike.",['clocked up','mounted up','brought up','crossed out'],"**clock up** takes a number as its object (km, hours, points). *Mount up* has no object: *Costs mounted up.*",['clock up — reach a total (miles, hours, points)','mount up — gradually increase']);
mc('c17','context','Vocabulary',"After a three-week trial, the court ____ the former mayor of all corruption charges.",['acquitted','liberated','interned','excused'],"The court declared him not guilty: **acquit sb of sth**.",['acquit — declare officially that someone is not guilty']);
mc('c18','context','Vocabulary',"During the war, thousands of foreign nationals were ____ in camps, even though they had committed no crime.",['interned','acquitted','liberated','excused'],"**Intern** = imprison, usually in wartime, without a trial.",['intern — imprison without a trial']);
mc('c20','context','Vocabulary',"Because of the flood, the city will ____ 2,000 rescue workers and 50 boats to the worst-hit districts.",['deploy','exert','administer','comprise'],"**Deploy** = send people or equipment where they are needed.",['deploy — move resources into position for use']);
mc('c21','context','Linkers',"Chicken rice sells out by noon in our canteen, ____ the vegetable soup is hardly touched.",['whereas','unlike','therefore','however'],"**whereas** joins two contrasting clauses in the middle of a sentence. *Unlike* is a preposition (it needs a noun); *however* and *therefore* need a full stop or semicolon before them.",['A, whereas B — two contrasting situations']);
mc('c22','context','Linkers',"The team trained hard for six months. ____, they lost in the first round.",['Nevertheless','Consequently','Likewise','Furthermore'],"The result is the opposite of what we expect, so we need **Nevertheless** (in spite of that).",['nevertheless — in spite of that']);
mc('c23','context','Linkers',"Heavy rain flooded the main road for hours. ____, all buses were rerouted.",['Consequently','Nevertheless','Likewise','Whereas'],"Cause then result: **Consequently** (as a result).",['consequently — as a result']);
mc('c24','context','Linkers',"____ how little time they had to prepare, the students gave an impressive presentation.",['Considering','Bringing','Accounting','Shining'],"**Considering (that)…** = taking into account… It can be followed by *how* + adjective or adverb.",['considering that + clause — taking into account the fact that']);
mc('c26','context','Idiom',"After two years in prison, Ben is determined to stay on the ____ and find an honest job.",['straight and narrow','fair and square','safe and sound','part and parcel'],"**on the straight and narrow** = living honestly and legally.",['on the straight and narrow — living honestly and legally']);

mc('c31','context','Vocabulary',"Despite everyone's warnings about the storm, Minh was ____ on sailing that night.",['bent','inclined','predisposed','obsessed'],"Only **bent** goes with *on*: *be bent on doing sth* = be determined to do it.",['be bent on doing sth — be determined to do something']);
mc('c33','context','Vocabulary',"Plain porridge may look ____, but it is cheap and nutritious.",['unappealing','unreliable','unavoidable','unanimous'],"**Unappealing** means not attractive. The other words mean *not trustworthy*, *impossible to avoid* and *fully agreed*.",['unappealing — not attractive','nutritious — containing substances that keep you healthy']);
mc('c34','context','Collocation',"In Vietnam, Tet and family reunions are so ____ linked that celebrating alone feels strange.",['inextricably','inevitably','indubitably','indomitably'],"**inextricably linked** = connected so closely that they cannot be separated.",['be inextricably linked — connected so closely they cannot be separated']);

ty('t1','Idiom',"When Mai failed to get the lead role, she said the play was boring anyway. Her friends just smiled. It was classic ____.",['sour grapes'],'criticising something you failed to get',"Criticising something you failed to get is **sour grapes**.");
ty('t2','Idiom',"Horror films are really not my ____.",['cup of tea'],'something you enjoy',"**not my cup of tea** = not something I enjoy.");
ty('t3','Idiom',"My grandmother has ____. Everything she plants grows!",['green fingers','green thumb'],'very good at gardening',"**have green fingers** (British English), without “a”. American English says *a green thumb*.");

ty('t6','Idiom',"Mr. Hung can fix cars, bake bread and play the piano, but he is a jack of all ____ and master of none.",['trades'],'plural noun meaning jobs or skills',"**a jack of all trades and master of none**: many skills, expert at none.");

ty('t10','Idiom',"Insulting a guest is completely out of ____ for Anna; she is usually so polite.",['character'],'a person\'s usual personality',"**out of character** = not typical of how someone usually behaves.");
ty('t11','Idiom',"Writing reports is just part and ____ of my job.",['parcel'],'an essential part',"**part and parcel of sth** = an essential part of it.");

/* ===== STAGE 5: STRUCTURES ===== */
ro('g1','Never before had Lan seen so beautiful a sunset.',"Inversion after **Never before** (had + subject + past participle), plus **so + adjective + a/an + noun**.");
ro('g2','Unappealing as the soup looked, it tasted wonderful.',"**Adjective + as + subject + verb** = although.",['It tasted wonderful, unappealing as the soup looked.']);
ro('g3','Had I known about the traffic, I would have taken the train.',"Third conditional with inversion: **Had + subject + past participle**, subject + would have + past participle.",['I would have taken the train had I known about the traffic.']);
ro('g4','Behind his calm face lay years of fear.',"Inversion after a place phrase: **Behind… + verb + subject** (the subject *years* is plural).");
ro('g5','The average height of men is greater than that of women.',"Compare like with like with **that of / those of** instead of repeating the noun.");
ro('g6','Why does the club object to her joining the team?',"**object to + (possessive) V-ing**. *To* is a preposition, so use *her joining*.");
ro('g7','Much as I love chocolate, I never eat it before bed.',"**Much as + subject + verb** = although (very much).",['I never eat it before bed, much as I love chocolate.']);
ro('g8','We would sooner you had told us the truth earlier.',"**would sooner + subject + had + past participle** = regret about the past.");

sp('s1',"Never before [A: I have seen] [B: such a spectacular] [C: show] [D: in my life].",['I have seen','such a spectacular','show','in my life'],0,"After **Never before**, put the auxiliary before the subject: *Never before have I seen…*");
sp('s2',"Daniel [A: assumes] [B: that the train] [C: has already left,] [D: hasn't it]?",['assumes','that the train','has already left,',"hasn't it"],3,"The main clause is *Daniel assumes* (third person), so the tag is **doesn't he?** Only with *I* does the tag follow the second clause (*I assume the train has left, hasn't it?*).");
sp('s3',"The [A: average lifespan] [B: of dogs is] [C: shorter than] [D: the one of humans].",['average lifespan','of dogs is','shorter than','the one of humans'],3,"Compare like with like: **that of humans**, not *the one of humans*.");
sp('s4',"She [A: was bent] [B: on to win] [C: the competition] [D: at all costs].",['was bent','on to win','the competition','at all costs'],1,"**be bent on + V-ing** gives *bent on winning*.");
sp('s5',"Why does the manager object to [A: she] [B: being appointed] [C: as the new head] [D: of the department]?",['she','being appointed','as the new head','of the department'],0,"After the preposition *to* in **object to**, use a possessive or object form: *her being appointed*.");
sp('s6',"Several messages [A: writing] [B: in invisible ink] [C: were found] [D: in the old diary].",['writing','in invisible ink','were found','in the old diary'],0,"A reduced passive relative clause uses the past participle: *messages **written** in invisible ink*.");
sp('s7',"We [A: would sooner] [B: the organisers] [C: would have informed] [D: us earlier].",['would sooner','the organisers','would have informed','us earlier'],2,"**would sooner + subject + had + past participle**: *the organisers **had informed** us*.");
sp('s8',"Behind her cheerful smile [A: lies] [B: years of] [C: disappointment and] [D: frustration].",['lies','years of','disappointment and','frustration'],0,"In inversion the verb agrees with the subject that comes after it: *years* is plural, so **lie**.");
sp('s9',"[A: Had we] [B: known] [C: about the delay,] we [D: would left] earlier.",['Had we','known','about the delay,','would left'],3,"Third conditional: **would have left**.");

mc('n1','grammar','Grammar',"Rarely ____ such a generous donation.",['have we received','we have received','did we received','we received'],"Negative adverbs (*rarely, never, seldom*) at the start of a clause force inversion: **have we received**.");
mc('n2','grammar','Grammar',"Never before ____ such a heavy storm in this region.",['had the residents experienced','the residents had experienced','did the residents experienced','have the residents experience'],"**Never before + had + subject + past participle** (an event before a past moment).");
mc('n3','grammar','Grammar',"____ the technician arrived earlier, the food wouldn't have spoiled.",['Had','If had','Unless had','Were'],"Third conditional with inversion: **Had + subject + past participle**, never *If had*.");
mc('n4','grammar','Grammar',"The population of Hanoi is larger than ____ of Da Nang.",['that','those','it','which'],"To refer back to a singular noun, use **that of…** (plural: *those of*).");
mc('n5','grammar','Grammar',"My parents don't object ____ abroad.",['to my studying','to me study','for me studying','to I studying'],"**object to + (possessive) V-ing**: *to my studying*.");
mc('n6','grammar','Grammar',"Several photos ____ during the trip were blurry.",['taken','taking','were taken','take'],"Reduced passive relative clause: *photos (which were) taken…*");
mc('n7','grammar','Grammar',"She believes the film starts at nine, ____?",["doesn't she",'does she',"doesn't it","isn't it"],"The subject of the main clause is **she**, so the tag follows it: *doesn't she?*");
mc('n8','grammar','Grammar',"I think the museum opens at eight, ____?",["doesn't it","don't I",'do I',"isn't it"],"With **I think/believe/assume**, the tag follows the second clause: *doesn't it?*");
mc('n9','grammar','Grammar',"I'd sooner you ____ the window now. It's freezing in here.",['closed','had closed','would have closed','closing'],"**would sooner + subject + past simple** (present or future); **+ had + past participle** (past). This is about now, so *closed*.");

mc('n11','grammar','Grammar',"____ I like jazz, I can't listen to it all day.",['Much as','Even as','Despite','As much'],"**Much as + subject + verb** = although (very much).");

/* ===== STAGE 6: EXAM PRACTICE ===== */
ex('e1','Idiom',"After failing the audition, Nina claimed that the play was not worth joining anyway. Her friends suspected that this was merely ____.",['a cup of tea','green fingers','full of beans','sour grapes'],3,"Nina failed the audition and then said the play wasn't worth joining. Criticising something you couldn't get is **sour grapes**.",['sour grapes — pretending something is not worth having because you failed to get it',"one's cup of tea — something you like",'have green fingers — be good at gardening','full of beans — full of energy','audition — a short performance to test an actor or singer','be worth doing sth — be good enough to be worth the effort']);
ex('e2','Grammar',"Never before had the critic watched ____ from a first-time director.",['such impressive film','so impressive a film','so impressive film','such impressive a film'],1,"After *Never before* the auxiliary comes first (*had the critic watched*). Pattern: **such a(n) + adj + N = so + adj + a(n) + N**, so *so impressive a film*.",['critic — a person who judges films, books or plays','such a(n) + adj + N = so + adj + a(n) + N']);
ex('e3','Vocabulary',"After new DNA evidence established that he could not have committed the crime, the prisoner was formally ____.",['liberated','acquitted','interned','excused'],1,"DNA evidence shows he is innocent, so the court formally declares him not guilty: **acquitted**.",['commit a crime — do something illegal','acquit — declare officially that someone is not guilty','liberate — set free','intern — imprison, usually in wartime, without a trial','excuse sb for doing sth — forgive someone for doing something']);
ex('e4','Conversation',"Nam is talking to his tutor after giving a presentation.\nNam: “I hope all those technical details weren’t too confusing.”\nTutor: “____. Your explanation was remarkably clear.”",['Not in the least','Just in case','You’re welcome','At all costs'],0,"Nam worries the details were confusing. “**Not in the least**” means “not at all”.",['technical — connected with practical or scientific methods','remarkably — in a surprising or impressive way','not in the least — not at all','just in case — as a precaution','at all costs — whatever it takes']);
ex('e5','Grammar',"Daniel assumes that the train has already left, ____?",['doesn’t he','does he','hasn’t it','has it'],0,"The main clause is *Daniel assumes* (third person), so the tag follows the main clause: **doesn't he?** Only with *I* (*I assume…*) does the tag follow the second clause.");
ex('e6','Idiom',"Marcus can repair computers, paint houses and design websites, but he is not truly skilled in any of them. He is a jack ____ and master of none.",['for all trades','of all tracks','of all trades','for all jobs'],2,"It is a fixed idiom: **a jack of all trades and master of none**.",['a jack of all trades and master of none — someone who can do many things but is not an expert in any']);
ex('e7','Idiom',"I cannot work efficiently with my supervisor constantly breathing down my ____.",['shoulder','neck','mouth','heart'],1,"**breathe down someone's neck** = watch someone too closely.",['efficiently — in a way that wastes little time or effort','supervisor — a person who watches over workers','constantly — all the time',"breathe down one's neck — watch someone too closely"]);
ex('e8','Collocation',"Despite facing several experienced opponents, the young lawyer remained ____ confident that she would win the case.",['acutely','blissfully','intensely','supremely'],3,"The collocation is **supremely confident**.",['supremely confident — extremely sure of yourself']);
ex('e9','Linkers',"Every prediction the analyst had made proved inaccurate. ____, the director decided to give him one final opportunity.",['Likewise','Furthermore','Nevertheless','Consequently'],2,"The predictions were wrong, but the director still gave him a chance. That contrast needs **Nevertheless**.",['analyst — a person who studies information carefully','inaccurate — not correct','likewise — in the same way']);
ex('e10','Collocation',"Abandoned buildings seem to ____ a strange fascination for many urban explorers.",['contain','comprise','weave','hold'],3,"The collocation is **hold a fascination for sb**.",['hold a fascination for sb — be very interesting to someone','comprise — consist of','weave — make cloth by crossing threads']);
ex('e11','Vocabulary',"Despite repeated warnings from his colleagues, Leo appeared ____ on confronting the director publicly.",['inclined','predisposed','obsessed','bent'],3,"Only **bent** is followed by *on*: **be bent on doing sth** = be determined to do it. The others take different prepositions (*inclined to*, *predisposed to*, *obsessed with*).",['confront — face someone and challenge them','be bent on doing sth — be determined to do something','be inclined to do sth — tend to do something','be predisposed to do sth — have a natural tendency to do something','be obsessed with sth — think about something all the time']);
ex('e12','Grammar',"Why does the department object to ____ as the new project manager? She has all the necessary qualifications.",['her being appointed','she being appointed','she be appointed','her be appointed'],0,"**object to + (possessive) V-ing**. *To* is a preposition here, so use *her being appointed*.",["object to (one's) doing sth — oppose someone doing something",'appoint — choose someone for a job or position']);
ex('e13','Collocation',"The peaceful silence of the examination hall was suddenly ____ by the ringing of a mobile phone.",['smashed','broken','crushed','fractured'],1,"The collocation is **break the silence**.",['break the silence — end a quiet moment by making a sound','smash — break violently into pieces','crush — press something until it loses its shape','fracture — crack or break (bones, hard objects)']);
ex('e14','Grammar',"Behind her cheerful smile ____ years of disappointment and frustration.",['lay','lying','did lie','lain'],0,"Inversion: **prepositional phrase of place + verb + subject**. The subject *years* is plural and the time is past, so *lay*.",['lie behind sth — be the hidden reason for something']);
ex('e15','Idiom',"Nobody persuaded Lucy to volunteer at the shelter; she did it entirely of her own ____.",['accord','desire','will','idea'],0,"Idiom: **of one's own accord** = willingly. (*Will* only works in *of one's own free will*.)",["of one's own accord — willingly, without being asked"]);
ex('e16','Grammar',"____, the dish is surprisingly delicious and nutritious.",['With the dish looks unappealing','As unappealing the dish looks','Unappealing as the dish looks','As the dish unappealing looks'],2,"**Adjective/adverb + as + subject + verb** = although. So *Unappealing as the dish looks*.",['nutritious — containing substances that keep you healthy','unappealing — not attractive']);
ex('e17','Grammar',"We would sooner the organisers ____ us about the cancellation before we travelled all the way there yesterday.",['had informed','would have informed','had been informed','informed'],0,"**would sooner + subject + had + past participle** expresses regret about the past (note *yesterday*).");
ex('e18','Grammar',"____ that the road would be closed, we would have chosen a different route.",['Had we known','Unless had we known','If had we known','As we had ever known'],0,"Third conditional with inversion: **Had + subject + past participle**, subject + would have + past participle.");
ex('e19','Grammar',"The average lifespan of some species of whale is considerably longer than ____.",['the one of humans’','that of humans','the humans’','humans'],1,"Compare like with like: the lifespan of whales and **that of humans** (= the lifespan of humans).",['lifespan — the length of time something lives','considerably — by a large amount']);
ex('e20','Idiom',"It was completely out of ____ for the normally generous businessman to refuse such a modest request.",['temperament','personality','nature','character'],3,"**out of character** = not typical of someone's usual behaviour.",['modest — small in size or amount',"out of character — not typical of someone's usual behaviour"]);
ex('e21','Collocation',"Several powerful companies are attempting to ____ pressure on the government to change the regulations.",['exert','implement','administer','deploy'],0,"The collocation is **exert pressure on sb**.",['exert pressure on sb — try hard to influence someone','administer — manage or organise','deploy — move resources into position for use']);
ex('e22','Collocation',"A soft, warm ____ of satisfaction spread across Maria’s face when her name was announced.",['ray','beam','shine','glow'],3,"The collocation is **a glow of satisfaction**.",['a glow of satisfaction — a warm look showing you are pleased']);
ex('e23','Phrasal verb',"When the interviewer ____ the subject of his previous dismissal, the candidate immediately became uncomfortable.",['mounted up','brought up','clocked up','put up'],1,"**bring up sth** = mention a topic.",['dismissal — losing your job because your employer ends your contract','bring up sth — mention a topic','bring sb up — raise a child','mount up — gradually increase','clock up — reach a total (miles, hours, points)','put up with — tolerate']);
ex('e24','Idiom',"Since leaving prison, Richard has remained on the ____ and has not been involved in any further trouble.",['fair and square','safe and sound','straight and narrow','part and parcel'],2,"**on the straight and narrow** = living honestly and legally.",['on the straight and narrow — living honestly and legally','fair and square — honestly and by the rules','safe and sound — unharmed','part and parcel of sth — an essential part of something']);
ex('e25','Idiom',"Their marriage has been on the ____ for months, and they are now considering a divorce.",['fire','rocks','clouds','wave'],1,"**on the rocks** = close to failure.",['on the rocks — close to failure']);
ex('e26','Idiom',"The child ____ his face in disgust after tasting the bitter medicine.",['crossed out','blew up','blacked out','screwed up'],3,"**screw up one's face** = twist your face in disgust.",["screw up one's face — twist your face in disgust",'cross out — draw a line through','blow up — explode; lose your temper','black out — lose consciousness or electricity']);
ex('e27','Collocation',"Language is so ____ linked to culture that studying one inevitably provides insights into the other.",['inevitably','inextricably','indubitably','indomitably'],1,"**inextricably linked** = connected so closely that they cannot be separated.",['inevitably — in a way that cannot be avoided','be inextricably linked — connected so closely they cannot be separated','indubitably — without any doubt','indomitably — in a way that cannot be defeated']);
ex('e28','Grammar',"Displayed in major galleries throughout the world, ____.",['the photographer became famous for his black-and-white portraits','visitors have admired the photographer’s black-and-white portraits','the photographer’s black-and-white portraits have received international acclaim','it was the photographer who created several black-and-white portraits'],2,"The participle phrase *Displayed in major galleries…* must describe the **subject of the main clause**. Only the *portraits* are displayed, not the photographer or the visitors.");
ex('e29','Grammar',"Several secret messages ____ in invisible ink were discovered inside the old diary.",['wrote','written','were written','be written'],1,"A reduced passive relative clause uses the past participle: *messages (which were) **written** in invisible ink*. *Were discovered* is already the main verb.");
ex('e30','Collocation',"During the long coach journey, the driver stopped every two hours so that passengers could ____ their legs.",['extend','span','stretch','range'],2,"The collocation is **stretch one's legs**.",["stretch one's legs — walk around after sitting for a long time"]);
ex('e31','Grammar',"It was meant to be a surprise party! You ____ Oliver about it yesterday.",['shouldn’t have told','mightn’t have told','mustn’t have told','couldn’t have told'],0,"The speaker is criticising a past action: **shouldn't have + past participle** = it was wrong to do it.",['shouldn’t have V3 — it was wrong to do it, but you did','might have V3 — it is possible that it happened','must have V3 — I am sure it happened','can’t have V3 — I am sure it did not happen','could have V3 — it was possible']);
ex('e32','Grammar',"____ that Hannah had never performed in public before, she handled the concert remarkably well.",['Bringing','Accounting','Shining','Considering'],3,"**Considering that + clause** = taking into account that…");
ex('e33','Linkers',"Some employees prefer working from home, ____ others are more productive in an office environment.",['whereas','unlike','therefore','however'],0,"**A, whereas/while B** contrasts two situations. *Unlike* is a preposition; *therefore* and *however* can't join two clauses with just a comma.");
ex('e34','Idiom',"On weekends, I try to strike ____ between completing household tasks and having enough time to relax.",['a double bind','a leading light','the common touch','a happy medium'],3,"**strike a happy medium between A and B** = find a fair balance.",['a double bind — a situation where every choice has a bad result','a leading light — an important and influential person','the common touch — the ability to get on well with ordinary people']);
ex('e35','Collocation',"Strict security measures have been ____ to protect customers’ personal information.",['carried','taken','tried','done'],1,"The collocation is **take measures** (passive: *measures have been taken*).",['take measures — do things to deal with a problem']);
ex('e36','Grammar',"____, she continued working until the final report had been completed.",['However exhausted she was','No matter exhausted she was','Despite she was exhausted','Much as exhausted she was'],0,"**However + adjective + subject + verb** = no matter how… *No matter* needs *how*; *Despite* can't be followed by a clause; *Much as* can't be followed by an adjective first.");

function fmt(s){
  let t=esc(s);

  return t.replace(/\n/g,'<br>');
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm=s=>String(s).toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?;:"“”]/g,'').replace(/\s+/g,' ').trim();
const canon=s=>norm(s).replace(/^(a|an|the|my|your|his|her|one's|someone's)\s+/,'');
function lev(a,b){
  const m=a.length,n=b.length;if(!m)return n;if(!n)return m;
  const d=[];for(let i=0;i<=m;i++){d[i]=[i];}for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}

const TTS=!!window.speechSynthesis&&!!window.SpeechSynthesisUtterance;
if(!TTS)document.documentElement.classList.add('no-tts');
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){}}
if(TTS){try{loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){speechSynthesis.onvoiceschanged=loadVoices}}catch(e){}}
function pickVoice(){
  const acc=SET.accent.toLowerCase();
  let c=voices.filter(v=>v.lang.replace('_','-').toLowerCase()===acc);
  if(!c.length)c=voices.filter(v=>v.lang.toLowerCase().indexOf('en')===0);
  const pref=c.find(v=>/natural|neural|google|samantha|daniel|serena|karen|aria|jenny|libby|sonia|ava|allison/i.test(v.name));
  return pref||c[0]||null;
}
function spk(t){
  return String(t).replace(/==|\*/g,'').replace(/\[([A-D]):\s*([^\]]+)\]/g,'$2').replace(/____/g,' blank ')
    .replace(/\bsb\b/g,'somebody').replace(/\bsth\b/g,'something').replace(/\s\/\s/g,' or ')
    .replace(/[“”()]/g,'').replace(/\s[—–]\s/g,', ').replace(/\s+/g,' ').trim();
}
let curBtn=null;
function say(text,btn){
  if(!TTS||!text)return;
  try{speechSynthesis.cancel();}catch(e){}
  if(curBtn){curBtn.classList.remove('playing');curBtn=null;}
  const u=new SpeechSynthesisUtterance(spk(text));
  const v=pickVoice();
  if(v){u.voice=v;u.lang=v.lang;}else u.lang=SET.accent;
  u.rate=SET.rate;
  if(btn){btn.classList.add('playing');curBtn=btn;}
  const end=()=>{if(btn)btn.classList.remove('playing');if(curBtn===btn)curBtn=null;};
  u.onend=end;u.onerror=end;
  try{speechSynthesis.speak(u);}catch(e){end();}
}
function closeSound(){const w=$('#snd');if(w&&!w.hidden){w.hidden=true;const sb=$('#sndbtn');if(sb)sb.setAttribute('aria-expanded','false');return true;}return false;}
document.addEventListener('click',e=>{

/* ---------- helpers for sentences ---------- */
const stripSpk=l=>l.replace(/^[A-Z][A-Za-z ]{0,13}:\s+/,'');
function blankLine(p){const ls=p.split('\n');return ls.find(x=>x.includes('____'))||null;}
function filledText(p,ans){const l=blankLine(p);return l?stripSpk(l).replace('____',ans):null;}
function filledMark(p,ans){const l=blankLine(p);return l?stripSpk(l).replace('____','=='+ans+'=='):null;}
function hlWords(example,term){
  const stop={sb:1,sth:1,"one's":1,the:1,and:1,of:1,a:1,be:1,have:1,that:1};
  const words=term.toLowerCase().replace(/\(.*?\)/g,'').split(/\s+/).filter(w=>w.length>=3&&!stop[w]);
  let t=esc(example);
  words.forEach(w=>{
    const stem=w.slice(0,Math.max(3,w.length-3)).replace(/[^a-z]/g,'');
    if(!stem)return;
    t=t.replace(new RegExp('\\b('+stem+'[a-z]*)','ig'),'<mark>$1</mark>');
  });
  return t.replace(/<\/mark>(\s)<mark>/g,'$1');
}
